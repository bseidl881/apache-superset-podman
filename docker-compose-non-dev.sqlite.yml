# -----------------------------------------------------------------------
# Overlay for a short-lived PoC using SQLite for Superset metadata instead of
# the bundled PostgreSQL service. Combine this with docker-compose-non-dev.yml.
# The SQLite files are expected under /app/sqlite, which is mounted from
# SQLITE_FILES_DIR (default: ./local_sqlite).
#
# Example:
#   podman compose -f docker-compose-non-dev.yml \
#     -f docker-compose-non-dev.sqlite.yml up --build
# -----------------------------------------------------------------------

services:
  db:
    profiles:
      - local-db

  superset:
    environment:
      SUPERSET__SQLALCHEMY_DATABASE_URI: ${SUPERSET__SQLALCHEMY_DATABASE_URI:-sqlite:////app/sqlite/superset.db?check_same_thread=false}
      SUPERSET__SQLALCHEMY_EXAMPLES_URI: ${SUPERSET__SQLALCHEMY_EXAMPLES_URI:-sqlite:////app/sqlite/examples.db?check_same_thread=false}

  superset-init:
    depends_on:
      redis:
        condition: service_started
    environment:
      SUPERSET__SQLALCHEMY_DATABASE_URI: ${SUPERSET__SQLALCHEMY_DATABASE_URI:-sqlite:////app/sqlite/superset.db?check_same_thread=false}
      SUPERSET__SQLALCHEMY_EXAMPLES_URI: ${SUPERSET__SQLALCHEMY_EXAMPLES_URI:-sqlite:////app/sqlite/examples.db?check_same_thread=false}
      SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-no}

  superset-worker:
    environment:
      SUPERSET__SQLALCHEMY_DATABASE_URI: ${SUPERSET__SQLALCHEMY_DATABASE_URI:-sqlite:////app/sqlite/superset.db?check_same_thread=false}
      SUPERSET__SQLALCHEMY_EXAMPLES_URI: ${SUPERSET__SQLALCHEMY_EXAMPLES_URI:-sqlite:////app/sqlite/examples.db?check_same_thread=false}

  superset-worker-beat:
    environment:
      SUPERSET__SQLALCHEMY_DATABASE_URI: ${SUPERSET__SQLALCHEMY_DATABASE_URI:-sqlite:////app/sqlite/superset.db?check_same_thread=false}
      SUPERSET__SQLALCHEMY_EXAMPLES_URI: ${SUPERSET__SQLALCHEMY_EXAMPLES_URI:-sqlite:////app/sqlite/examples.db?check_same_thread=false}

  superset-mcp:
    environment:
      SUPERSET__SQLALCHEMY_DATABASE_URI: ${SUPERSET__SQLALCHEMY_DATABASE_URI:-sqlite:////app/sqlite/superset.db?check_same_thread=false}
      SUPERSET__SQLALCHEMY_EXAMPLES_URI: ${SUPERSET__SQLALCHEMY_EXAMPLES_URI:-sqlite:////app/sqlite/examples.db?check_same_thread=false}

