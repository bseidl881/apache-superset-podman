# -----------------------------------------------------------------------
# Overlay for using an external PostgreSQL instance instead of the bundled
# local `db` service. Combine this with docker-compose-non-dev.yml and set
# DATABASE_* in docker/.env-local (or deployment environment variables).
#
# Example:
#   podman compose -f docker-compose-non-dev.yml \
#     -f docker-compose-non-dev.external-db.yml up --build
# -----------------------------------------------------------------------

services:
  db:
    profiles:
      - local-db

  superset-init:
    depends_on:
      redis:
        condition: service_started

